    temporal_coverage:
      start: '2010-01-01'
      end: '2025-04-12'
    geographic_coverage: MTA Bridges and Tunnels toll plazas
    geometry: null
    grain: one calendar-day aggregate per toll plaza and direction
    source_semantics: The catalog view aggregates an hourly source to date, plaza ID, and direction. It is not suitable for hourly analysis.
    schema:
      required_columns: [Date, Plaza ID, Direction, '# Vehicles - E-ZPass', '# Vehicles - VToll']
      # Structured so the pipeline can publish a name and a code with every crossing record
      # (PRD FR-04 asks for named facilities). Identifiers 1-9 and 11 appear in the raw file but are
      # not named by authority metadata, so they carry no mapping here; the pipeline refuses to
      # publish a crossing it cannot name rather than rendering a bare identifier.
      facility_ids:
        - plaza_id: 21
          facility_code: TBX
          facility_name: Robert F. Kennedy Bridge (Bronx and Queens plazas)
        - plaza_id: 22
          facility_code: TBM
          facility_name: Robert F. Kennedy Bridge (Manhattan plaza)
        - plaza_id: 23
          facility_code: BWB
          facility_name: Bronx-Whitestone Bridge
        - plaza_id: 24
          facility_code: HHB
          facility_name: Henry Hudson Bridge
        - plaza_id: 25
          facility_code: MPB
          facility_name: Marine Parkway-Gil Hodges Memorial Bridge
        - plaza_id: 26
          facility_code: CBB
          facility_name: Cross Bay Veterans Memorial Bridge
        - plaza_id: 27
          facility_code: QMT
          facility_name: Queens Midtown Tunnel
        - plaza_id: 28
          facility_code: HCT
          facility_name: Hugh L. Carey Tunnel
        - plaza_id: 29
          facility_code: TNB
          facility_name: Throgs Neck Bridge
        - plaza_id: 30
          facility_code: VNB
          facility_name: Verrazzano-Narrows Bridge
      direction_values:
        I: inbound; official meaning varies by facility and is documented by the source
        O: outbound; official meaning varies by facility and is documented by the source
    allowed_uses:
      - observed daily facility and direction comparisons after parser and quality validation
      - E-ZPass and VToll totals/shares with denominator documented
    forbidden_claims:
      - hourly traffic analysis from this daily aggregate
      - causal congestion-pricing effect
    transformations: []

