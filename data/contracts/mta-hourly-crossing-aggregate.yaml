  source_rows_2025_2026: 2939033
output:
  grain: one calendar day, facility, full source direction, with payment components
  fields:
    ezpass_vehicles: non-negative integer or null when the aggregate is absent
    tolls_by_mail_vehicles: non-negative integer or null when the aggregate is absent
