schema_version: 1.0.0
contract_id: browser-release-manifest
title: Browser-facing immutable data release manifest
required_fields:
  - release_id
  - schema_version
  - generated_at
  - status
  - source_ids
  - transform_version
  - coverage
  - limitations
  - assets
allowed_asset_kinds: [boundary_zone, traffic_observations, facility_crossings, crz_context, dac_context, historical_context, health_context, air_measurements, air_quality_context, neighborhood_context]
allowed_asset_formats: [json, geojson, csv]
asset_required_fields:
  - kind
  - path
  - format
  - sha256
  - coverage
  - grain
  - source_ids
  - source_urls
  - transform_version
  - status
  - limitations
asset_optional_fields:
  - geometry_crs
  - bytes
manifest_optional_fields:
  - policy_reference_date
rules:
  - asset paths must be relative, URL-safe, and cannot reference raw or demo data
  - asset path extensions must match the declared format
  - CSV assets are limited to air_measurements and must be checksum-declared
  - spatial browser assets must declare EPSG:4326
  - each asset kind is source-specific and may not silently merge unrelated measures
  - policy_reference_date is release metadata, never a frontend constant
  - every published asset carries at least one http(s) source_urls entry, because the PRD requires a
    source/method link on every displayed metric and a register identifier is not a link
  - a contract exists in data/contracts for each published domain, and pipeline/tests asserts that
    every published asset kind appears in allowed_asset_kinds
