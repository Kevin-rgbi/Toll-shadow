name: verify

# The release gate was manual, which left the PRD metric "CI blocks synthetic: true" only half true.
# This workflow runs every blocking check on a push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Release acceptance gate
        run: python3 scripts/release_acceptance.py --json > gate-report.json

      - name: Install the browser the end-to-end suite drives
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        # Runs against the build produced above, served by `vite preview`; the config starts it.
        run: npm run test:e2e

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: gate-report.json

      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-report
          path: test-results/
          if-no-files-found: ignore
