schema_version: 1.1.0
release_id: 2026-09-20.5
policy_reference:
  date: '2025-01-05'
  source_url: https://www.mta.info/press-release/new-york-joins-world-cities-launch-of-first-nation-program-deliver-cleaner-air-less
  use: timeline marker only; it does not create a causal or counterfactual comparison
measures:
  - measure_id: dot_monthly_sampled_traffic_volume
    asset_kind: traffic_observations
    source_ids: [dot_automated_traffic_counts_archive_20260915]
    coverage:
      start: '2024-01-01'
      end: '2025-12-31'
    grain: one segment, borough, direction, calendar-month, day-type, and time-band aggregate of available 15-minute DOT observations
    numerator: sum of non-negative observed 15-minute traffic volumes in the group
    denominator: number of validated raw DOT observations in the group
    aggregation: mean_observed_15_min_volume = numerator / denominator; also publish maximum volume, observation count, distinct observed days, and count-session count
    dimensions:
      day_type:
        values: [Weekday, Weekend]
        rule: Saturday and Sunday are Weekend; every other day is Weekday.
      time_band:
        values: ['Overnight (22-06)', 'AM peak (06-09)', 'Midday (09-16)', 'PM peak (16-19)', 'Evening (19-22)']
        rule: Derived from the observation hour. Every hour falls in exactly one band. The labels match the legacy Kepler table so the two can be compared.
    inclusion_rules:
      - calendar date within coverage
      - valid DOT contract row with non-negative volume
    exclusion_rules:
      - invalid source row, including the archived negative-volume sentinel
    limitations:
      - DOT counts are samples and do not represent continuous or full-year traffic measurement
      - aggregation is descriptive and does not estimate a congestion-pricing effect
      - blank street labels are retained as null metadata, not inferred
      - a group is only published where the source contains observations for that segment, month, day type, and time band; absent combinations are omitted rather than zero-filled
    claim_policy: descriptive_only

  - measure_id: mta_daily_facility_crossings
    asset_kind: facility_crossings
    source_ids: [mta_daily_bridge_tunnel_traffic_archive_20260915]
    coverage:
      start: '2024-01-01'
      end: '2025-04-12'
    grain: one calendar-day, toll-plaza, and direction aggregate
    numerator: daily E-ZPass vehicles or daily VToll vehicles as supplied by MTA
    denominator: total_vehicles = E-ZPass vehicles + VToll vehicles for the same source row
    aggregation: preserve one validated source aggregate per date, plaza, and direction; compute E-ZPass share only when total_vehicles is greater than zero
    inclusion_rules:
      - calendar date within coverage
      - valid MTA daily contract row with a known plaza ID and I/O direction
    exclusion_rules:
      - invalid source row
      - a plaza identifier with no facility name in the source register
    facility_naming: plaza identifiers are resolved to a name and code from the source register; a crossing the register cannot name is refused rather than published with a bare identifier
    limitations:
      - source is a daily aggregate view and cannot support hourly analysis
      - facility comparisons are descriptive and do not estimate a congestion-pricing effect
      - archive coverage ends 2025-04-12
    claim_policy: descriptive_only
  - measure_id: crz_monthly_detection_group_entries
    asset_kind: crz_context
    source_ids: [mta_crz_entries_archive_20260920]
    coverage:
      start: '2025-01-01'
      end: '2026-09-30'
    grain: one calendar-month aggregate per CRZ detection group
    numerator: summed crz_entries for the detection group and month, or summed excluded_roadway_entries
    denominator: not applicable; these are sums over the month, not rates
    aggregation: one documented SoQL aggregate of the authoritative 10-minute CRZ dataset, reduced to monthly sums per detection group
    inclusion_rules:
      - month within coverage
      - aggregate row with a detection group, a region, and non-negative integer sums
    exclusion_rules:
      - aggregate row with an unparseable month or a non-integer count
    limitations:
      - detection groups are areas around the Central Business District, not detector points
      - the published grain is monthly; hourly or 10-minute analysis is not supported by this asset
      - entries are counts of vehicles entering, not revenue, payment behaviour, or route displacement
      - descriptive only; no causal policy effect is estimated
    claim_policy: descriptive_only

  - measure_id: nyccas_air_context_relative
    asset_kind: historical_context
    source_ids: [nyccas_air_context_derived_2016]
    coverage:
      start: '2016-01-01'
      end: '2016-12-31'
    grain: one modelled value per pooled grid cell of about 600 m
    numerator: not applicable; a modelled surface is published as a relative field
    denominator: not applicable
    aggregation: 2x2 mean of the archived 300 m cells, NoData masked, min-max normalised within this surface only
    inclusion_rules:
      - source cell inside the archived grid and not equal to the NoData sentinel
    exclusion_rules:
      - cells whose whole 2x2 block is NoData, published as null rather than zero
    limitations:
      - a modelled historical surface, not a monitor reading
      - the pollutant and period labels are inferred from the source filename; the archive carries no codebook
      - absolute units are not established, so only a relative field is published
      - no causal or health claim follows from this layer
    claim_policy: descriptive_only
  - measure_id: nys_asthma_historical_context
    asset_kind: health_context
    source_ids: [nys_asthma_context_derived_historical]
    coverage:
      start: '2000-01-01'
      end: '2019-12-31'
    grain: one rolling multi-year period per county, indicator and total subgroup
    numerator: the source's event count for the period, where the source supplies one
    denominator: the source's age-adjusted rate per 10,000, published as supplied
    aggregation: filtered to the five borough counties and the Total subgroup; no rate is recomputed
    inclusion_rules:
      - county in the five New York City boroughs
      - subgroup1 and subgroup2 both Total
      - rolling multi-year period
    exclusion_rules:
      - single-year rows, subgroup rows, and blank rates
    limitations:
      - historical context ending 2019; not a post-policy outcome
      - county (borough) geography, not a neighbourhood estimate
      - descriptive only; no causal health claim
    claim_policy: descriptive_only
  - measure_id: archived_dac_context_2023
    asset_kind: dac_context
    source_ids: [nyc_dac_context_derived_2023]
    coverage:
      start: '2023-01-01'
      end: '2023-12-31'
    grain: one archived census-tract feature
    numerator: not applicable; a geography layer carries no measure
    denominator: not applicable
    aggregation: geometry simplified with a 0.0004 degree tolerance, topology preserved, for display
    inclusion_rules:
      - feature present in the archived New York City disadvantaged-communities layer
    exclusion_rules:
      - features outside the archived layer
    limitations:
      - the archived 2023 criteria, not the 2025 Version 2.0 revision
      - a geography layer, not an estimate of individual risk or exposure
      - published after the owner release decision recorded in the work log
    claim_policy: descriptive_only
excluded_asset_kinds:
  cbd_boundary: Legacy derivative needs geometry/release validation.
